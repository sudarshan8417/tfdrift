# Scheduled drift detection using the tfdrift GitHub Actions action.
# Runs every 6 hours, posts annotations to PRs, and uploads drift as
# Code Scanning alerts in the Security tab.
#
# Required secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  — read-only AWS credentials
#   SLACK_WEBHOOK                              — optional Slack notifications
name: Terraform Drift Check

on:
  schedule:
    - cron: '0 */6 * * *'
  pull_request:
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required for Code Scanning upload

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Detect drift
        id: drift
        uses: sudarshan8417/tfdrift@v1
        with:
          path: .
          min-severity: low
          fail-on: high
          sarif-output: results/tfdrift.sarif
          json-output: results/drift-report.json
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/tfdrift.sarif

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: results/drift-report.json

      - name: Print drift summary
        if: always()
        run: |
          echo "Drift detected: ${{ steps.drift.outputs.has-drift }}"
          echo "Drifted resources: ${{ steps.drift.outputs.drift-count }}"
