# PR gate — blocks merges when critical or high drift is detected.
# Use this alongside your normal Terraform plan/apply workflow to catch
# out-of-band changes before they cause apply failures.
#
# Required secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  — read-only AWS credentials
name: Drift Gate

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.tfvars'

jobs:
  drift-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # for PR annotations

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Check for critical/high drift
        uses: sudarshan8417/tfdrift@v1
        with:
          path: .
          min-severity: medium   # suppress low/info noise in PRs
          fail-on: high          # block only on high+ severity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
